spring:
  cloud:
    gateway:
      routes:
        - id: orders-service
          uri: lb://orders-service
          predicates:
            - Path=/orders/**

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/inventory/**


        - id: security-service
          uri: lb://security-service
          predicates:
            - Path=/auth/**

  application:
    name: gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080

  logging:
    level:
      org.springframework.cloud.gateway: DEBUG
      com.netflix.eureka: DEBUG
